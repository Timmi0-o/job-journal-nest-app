services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-journal-nest-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-7878}:${APP_PORT:-7878}'
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-7878}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-journal}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-journal_secret}
      DATABASE_NAME: ${POSTGRES_DB:-job_journal}
      DATABASE_URL: postgresql://${POSTGRES_USER:-journal}:${POSTGRES_PASSWORD:-journal_secret}@postgres:5432/${POSTGRES_DB:-job_journal}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: job-journal-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journal_secret}
      POSTGRES_DB: ${POSTGRES_DB:-job_journal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-journal} -d ${POSTGRES_DB:-job_journal}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
